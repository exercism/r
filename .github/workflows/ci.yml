# This workflow will do a clean install of the dependencies and run tests across different versions
#
# Requires scripts:
# - bin/run_tests.R

name: Exercise tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "exercises/**"
      - "bin/run_tests.R"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "exercises/**"
      - "bin/run_tests.R"
      - ".github/workflows/ci.yml"

jobs:
  ci:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: r-lib/actions/setup-r@465b7d8e732ca3921382b1674c59bada9cbf3399
        with:
          r-version: 4.6.1

      - uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6
        with:
          cache-version: 2
          packages: |
            testthat
            jsonlite
            dplyr
            stringr
            purrr
            tibble
            lubridate
            forcats

      - name: Run exercism/r ci (runs tests) for all exercises
        run: |
          source("bin/run_tests.R")
        shell: Rscript {0}
